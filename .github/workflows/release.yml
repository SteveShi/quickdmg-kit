name: Release XCFramework

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build QuickdmgKit.xcframework
        run: |
          chmod +x ./Scripts/make_xcframework.sh
          ./Scripts/make_xcframework.sh

      - name: Package XCFramework Zip & Compute SHA256
        run: |
          cd output
          zip -qry ../QuickdmgKit.xcframework.zip QuickdmgKit.xcframework
          cd ..
          CHECKSUM=$(shasum -a 256 QuickdmgKit.xcframework.zip | awk '{print $1}')
          echo "SHA256 Checksum: $CHECKSUM"
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_ENV
          echo "Checksum: \`$CHECKSUM\`" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: QuickdmgKit.xcframework.zip
          body_path: release_notes.md
          draft: false
          prerelease: false
